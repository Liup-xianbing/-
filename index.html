<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>飞书自定义公式指标卡</title>
  <script src="https://lf1-cdn-tos.bytegoofy.com/goofy/lark/op/h5-js-sdk-1.5.28.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .metric-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
      min-width: 280px;
    }
    .metric-header {
      font-size: 18px;
      color: #666;
      margin-bottom: 16px;
    }
    .metric-value {
      font-size: 48px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    .metric-label {
      font-size: 14px;
      color: #999;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect } = React;
    
    function App() {
      const [config, setConfig] = useState(null);
      const [data, setData] = useState({});
      const [mounted, setMounted] = useState(false);

      useEffect(() => {
        setMounted(true);
        
        if (!window.h5sdk) {
          console.log('未在飞书环境中运行，使用模拟数据');
          setData({ 销售额: 150000, 订单数: 320, 客户数: 85 });
          setConfig({
            title: '销售数据指标卡',
            metric: '销售额',
            aggregation: 'sum',
            unit: '元'
          });
          return;
        }

        window.h5sdk.ready(() => {
          const urlParams = new URLSearchParams(window.location.search);
          const configStr = urlParams.get('config');
          if (configStr) {
            try {
              setConfig(JSON.parse(decodeURIComponent(configStr)));
            } catch (e) {
              console.error('配置解析失败', e);
            }
          }
        });
      }, []);

      const calculateMetric = () => {
        if (!config || !data) return 0;
        const value = data[config.metric] || 0;
        switch (config.aggregation) {
          case 'sum': return value;
          case 'avg': return value;
          case 'count': return Object.keys(data).length;
          case 'max': return value;
          case 'min': return value;
          default: return value;
        }
      };

      const formatValue = (value) => {
        if (!config) return value;
        switch (config.unit) {
          case '元': return `¥${value.toLocaleString()}`;
          case '万': return `${(value / 10000).toFixed(2)}万`;
          case '%': return `${value.toFixed(2)}%`;
          default: return value.toLocaleString();
        }
      };

      if (!mounted) return null;

      return (
        <div className="metric-card">
          <div className="metric-header">{config?.title || '指标卡'}</div>
          <div className="metric-value">{formatValue(calculateMetric())}</div>
          <div className="metric-label">
            {(config?.aggregation === 'sum' ? '总计' : 
              config?.aggregation === 'avg' ? '平均' :
              config?.aggregation === 'count' ? '计数' : '') + ' ' + (config?.metric || '')}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<app ></app>);
  </script>
</body>
</html>

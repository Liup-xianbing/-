<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>飞书自定义公式指标卡</title>
  <script src="https://lf1-cdn-tos.bytegoofy.com/goofy/lark/op/h5-js-sdk-1.5.28.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;justify-content:center;align-items:center}
    .metric-card{background:rgba(255,255,255,.95);border-radius:16px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;min-width:280px}
    .metric-header{font-size:18px;color:#666;margin-bottom:16px}
    .metric-value{font-size:48px;font-weight:700;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
    .metric-label{font-size:14px;color:#999}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const {useState,useEffect}=React;
    function App(){
      const [config,setConfig]=useState({title:'销售数据指标卡',metric:'销售额',aggregation:'sum',unit:'元'});
      const [data,setData]=useState({销售额:150000,订单数:320,客户数:85});
      const calc=()=>data[config.metric]||0;
      const fmt=v=>{
        switch(config.unit){
          case'元':return'¥'+v.toLocaleString();
          case'万':return(v/1e4).toFixed(2)+'万';
          case'%':return v.toFixed(2)+'%';
          default:return v.toLocaleString()
        }
      };
      return React.createElement('div',{className:'metric-card'},
        React.createElement('div',{className:'metric-header'},config.title),
        React.createElement('div',{className:'metric-value'},fmt(calc())),
        React.createElement('div',{className:'metric-label'},'总计 '+config.metric)
      )
    }
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
